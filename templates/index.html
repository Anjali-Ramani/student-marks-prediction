<!DOCTYPE html>
<html>
<head>
    <title>Student Pass Predictor</title>
    <link rel="stylesheet"
href="{{ url_for('static', filename='style.css') }}">
</head>
<body>



<div class="container">

<h2>🎓 Student Pass Predictor</h2>

<form action="/predict" method="POST">

<input type="number"
name="hours"
placeholder="Study Hours"
required>

<input type="number"
name="attendance"
placeholder="Attendance"
required>

<button type="submit">Predict</button>

</form>

{% if prediction %}
<h3>{{ prediction }}</h3>
{% endif %}

</div>


</body>
</html>

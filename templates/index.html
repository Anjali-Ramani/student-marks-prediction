<!DOCTYPE html>
<html>
<head>
    <title>Student Pass Predictor</title>
</head>
<body>

<h2>Student Pass Prediction</h2>

<form action="/predict" method="POST">

    Study Hours:
    <input type="number" name="hours" required><br><br>

    Attendance:
    <input type="number" name="attendance" required><br><br>

    <input type="submit" value="Predict">

</form>

{% if prediction %}
    <h3>{{ prediction }}</h3>
{% endif %}

</body>
</html>
